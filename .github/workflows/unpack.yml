name: unpack-zip
on: push
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project and commit it
        run: |
          if [ -f dbt-shop-demo.zip ]; then
            unzip -o dbt-shop-demo.zip
            rm dbt-shop-demo.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git reset -q .github/workflows/unpack.yml
            git commit -m "Add the dbt shop demo project"
            git push
          fi
